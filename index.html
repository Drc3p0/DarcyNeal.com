<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darcy Neal — Interactive Hardware Design</title>
<meta name="description" content="Darcy Neal is an interactive audio-visual hardware designer and educator. Wearables, PCB art, installations, and the workshops that teach them.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Azeret+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="logo mono">DARCY NEAL</div>
  <div class="nav-right">
    <div class="nav-links mono">
      <a href="work.html">CREATIONS</a>
      <a href="workshops.html">WORKSHOPS</a>
      <a href="music.html">MUSIC</a>
      <a href="about.html">ABOUT</a>
    </div>
    <button class="theme-toggle" data-theme-toggle type="button"></button>
  </div>
</nav>

<div class="hero">
  <h1 class="display-font">Darcy Neal</h1>
  <p class="lede body-font" data-content="hero.lede"></p>
  <div class="meta mono" data-content="hero.meta"></div>
</div>

<div class="section section-centered" id="work">
  <h2 class="display-font section-heading reveal" data-content="creations.heading"></h2>
  <div class="work-grid reveal-group" data-work-grid data-work-grid-limit="3">
    <!-- populated by js/site.js from data/portfolio.js, first 3 entries only -->
  </div>
  <a href="work.html" class="btn-pill btn-pill-centered reveal" data-content="creations.ctaLabel"></a>
</div>

<div class="section section-centered workshops-feature" id="workshops">
  <h2 class="display-font section-heading reveal" data-content="workshops.heading"></h2>
  <p class="feature-dek reveal" data-content="workshops.dek"></p>
  <div class="workshop-masonry reveal-group">
    <figure class="reveal"><img src="images/emf-badge/emf-badge-in-hand.jpg" alt="EMF Explorer badge held in hand" loading="lazy"></figure>
    <figure class="reveal"><img src="images/freeform-led-workshop/IMG_5289.png" alt="Freeform LED sculpture workshop" loading="lazy"></figure>
    <figure class="reveal"><img src="images/pathlighter/pathlighter-assembly.jpg" alt="Pathlighter soldering workshop assembly" loading="lazy"></figure>
  </div>
  <a href="workshops.html" class="btn-pill btn-pill-centered reveal" data-content="workshops.ctaLabel"></a>
</div>

<footer class="home-footer">
  <div class="home-footer-grid">
    <div class="home-footer-col">
      <div class="label mono">ABOUT</div>
      <p data-content="about.text"></p>
      <a href="about.html" class="btn-pill" data-content="about.ctaLabel"></a>
    </div>
    <div class="home-footer-col">
      <div class="label mono">DAY JOB</div>
      <p data-content="dayJob.text"></p>
      <a class="btn-pill" target="_blank" rel="noopener" data-content="dayJob.ctaLabel" data-content-href="dayJob.ctaHref"></a>
    </div>
    <div class="home-footer-col">
      <div class="label mono">GET IN TOUCH</div>
      <p class="mono" style="font-size:13px;" data-content="contact.text"></p>
    </div>
  </div>
  <div class="site-footer mono">
    <div>darcyneal.com</div>
    <div class="home-footer-archive">
      <a href="music.html" data-content="musicArchive.label" data-content-href="musicArchive.href"></a>
    </div>
  </div>
</footer>

<script src="data/portfolio.js"></script>
<script src="data/site-content.js"></script>
<script src="js/theme.js"></script>
<script src="js/site.js"></script>
<script src="js/reveal.js"></script>
</body>
</html>
